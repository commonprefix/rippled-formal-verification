# The part linked into xrpld: the model and its FFI exports, with no mathlib
# (`lake -f lakefile-model.toml build XRPLModel:static`). The name must stay
# "XRPL", as it is part of the exported initializer's symbol.
name = "XRPL"

[leanOptions]
weak.backward.do.legacy = true
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.style.show = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[lean_lib]]
name = "XRPLModel"
roots = ["XRPL.FFI.FFI"]
globs = ["XRPL.Model.+", "XRPL.FFI.+"]
