name = "XRPL"
defaultTargets = ["XRPL"]
allowNonModules = true

[leanOptions]
weak.backward.do.legacy = true
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.style.show = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Everything, proofs included: what `lake build` checks. The part linked into
# xrpld is built from lakefile-model.toml, without mathlib.
[[lean_lib]]
name = "XRPL"
# Every file under XRPL/, so a file is checked even if nothing imports it.
globs = ["XRPL", "XRPL.+"]
