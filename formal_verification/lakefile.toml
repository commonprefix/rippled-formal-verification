name = "XRPL"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["XRPL"]

[leanOptions]
# Keep the legacy `do` lowering: 4.32+ switched to `EarlyReturnT`/`EarlyReturn.runK`, which
# changes the lowered body the Vault proofs walk. `weak.` = ignored on 4.28/4.29, where the
# option does not exist (and legacy is the only behaviour anyway).
weak.backward.do.legacy = true
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.style.show = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "XRPL"

# lake build XRPLModel:static
[[lean_lib]]
name = "XRPLModel"
roots = ["XRPL.Model.Model", "XRPL.FFI.FFI"]
globs = ["XRPL.Model.+", "XRPL.FFI.+"]
