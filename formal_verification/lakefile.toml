name = "XRPL"
defaultTargets = ["XRPL"]
allowNonModules = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Everything, proofs included: what `lake build` checks. The part linked into
# xrpld is built from lakefile-model.toml, without mathlib.
[[lean_lib]]
name = "XRPL"
# XRPL.lean with what it imports, and every file under XRPL/Model/ and XRPL/FFI/.
globs = ["XRPL", "XRPL.Model.+", "XRPL.FFI.+"]
